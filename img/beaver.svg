<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Beaver in a sailor cap">
  <!-- original cartoon beaver; not an Oregon State University mark -->
  <circle cx="60" cy="60" r="58" fill="#f26a1b"/>
  <circle cx="60" cy="60" r="52" fill="#111"/>
  <!-- ears -->
  <circle cx="33" cy="52" r="10" fill="#7a4a24"/><circle cx="33" cy="52" r="5" fill="#b9805a"/>
  <circle cx="87" cy="52" r="10" fill="#7a4a24"/><circle cx="87" cy="52" r="5" fill="#b9805a"/>
  <!-- head -->
  <ellipse cx="60" cy="72" rx="30" ry="28" fill="#8b5a2b"/>
  <!-- muzzle -->
  <ellipse cx="60" cy="84" rx="18" ry="13" fill="#d9a77c"/>
  <!-- eyes -->
  <circle cx="48" cy="67" r="6" fill="#fff"/><circle cx="72" cy="67" r="6" fill="#fff"/>
  <circle cx="49.5" cy="68" r="3.2" fill="#111"/><circle cx="73.5" cy="68" r="3.2" fill="#111"/>
  <circle cx="50.6" cy="66.8" r="1" fill="#fff"/><circle cx="74.6" cy="66.8" r="1" fill="#fff"/>
  <!-- brows (a little cocky) -->
  <path d="M41 58 q7 -4 13 0" stroke="#3b2412" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M66 58 q7 -4 13 0" stroke="#3b2412" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- nose + grin -->
  <ellipse cx="60" cy="77" rx="6" ry="4.2" fill="#2b1a0e"/>
  <path d="M50 85 q10 7 20 0" stroke="#2b1a0e" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- buck teeth -->
  <rect x="54.6" y="87" width="5" height="8" rx="1.2" fill="#fff" stroke="#2b1a0e" stroke-width="1"/>
  <rect x="60.4" y="87" width="5" height="8" rx="1.2" fill="#fff" stroke="#2b1a0e" stroke-width="1"/>
  <!-- sailor cap, tilted -->
  <g transform="rotate(-10 60 42)">
    <path d="M30 46 q30 -26 60 0 z" fill="#fff"/>
    <ellipse cx="60" cy="47" rx="32" ry="7" fill="#fff" stroke="#d6d6d6" stroke-width="1"/>
    <rect x="29" y="43" width="62" height="5" rx="2.5" fill="#111"/>
    <circle cx="60" cy="27" r="3.4" fill="#f26a1b"/>
  </g>
</svg>
